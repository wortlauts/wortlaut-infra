name: Report PROD deploy

on:
  push:
    branches: [prod-status]

permissions:
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: prod-status

      - name: Publish the result on the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f status.env ]]; then
            echo "No deployment has been reported yet."
            exit 0
          fi
          field() { sed -n "s/^$1=//p" status.env | head -n 1; }
          revision="$(field revision)"
          result="$(field result)"
          message="$(field message)"
          services="$(field services)"

          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid revision in status.env"; exit 1; }
          [[ "$result" == success || "$result" == failure ]] || { echo "::error::Invalid result in status.env"; exit 1; }

          {
            echo "### PROD deploy of \`${revision:0:7}\`: $result"
            echo
            echo "$message"
            echo
            echo "| Service | State |"
            echo "| --- | --- |"
            for service in $services; do
              echo "| ${service%%=*} | ${service#*=} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          state=success
          [[ "$result" == success ]] || state=failure
          gh api "repos/$GITHUB_REPOSITORY/statuses/$revision" \
            --field state="$state" \
            --field context="deploy/prod" \
            --field description="${message:0:120}" \
            --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

          [[ "$result" == success ]]
