name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate the development stack
        run: docker compose -f compose/dev/compose.yaml config --quiet

      - name: Validate the production stack
        env:
          ELASTIC_PASSWORD: placeholder
          KIBANA_SYSTEM_PASSWORD: placeholder
          KIBANA_ENCRYPTION_KEY: placeholder
          API_ES_USERNAME: placeholder
          API_ES_PASSWORD: placeholder
          INDEXER_ES_USERNAME: placeholder
          INDEXER_ES_PASSWORD: placeholder
        run: docker compose --env-file compose/prod/versions.env -f compose/prod/compose.yaml config --quiet
